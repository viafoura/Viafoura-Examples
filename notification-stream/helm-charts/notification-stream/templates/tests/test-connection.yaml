{{- $fullName := include "notification-stream.fullname" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ $fullName }}-test-connection"
  labels:
    {{- include "notification-stream.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ $fullName }}:{{ .Values.service.port }}{{ .Values.readinessProbe.httpGet.path }}']
  restartPolicy: Never
